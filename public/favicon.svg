<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Housing -->
  <polygon
    points="50,12 83,31 83,69 50,88 17,69 17,31"
    fill="url(#bgGrad)"
    stroke="url(#shieldGrad)"
    stroke-width="4.5"
    filter="url(#glow)"
  />

  <!-- Camera Speed Notch (Left) -->
  <polygon points="17,45 8,36 8,64 17,55" fill="#00f0ff" />

  <!-- Dual-team Rocket League Accent Rings -->
  <!-- Blue Team Arc (top-left) -->
  <path
    d="M 28 50 A 22 22 0 0 1 66 34"
    stroke="#00e5ff"
    stroke-width="4"
    stroke-linecap="round"
  />
  <!-- Orange Team Arc (bottom-right) -->
  <path
    d="M 72 50 A 22 22 0 0 1 34 66"
    stroke="#ff7700"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Camera Core / Ball Aperture -->
  <circle cx="50" cy="50" r="14" fill="#070c1e" stroke="#00e5ff" stroke-width="2.5" />
  <circle cx="50" cy="50" r="8" fill="#00d4ff" />
  <circle cx="50" cy="50" r="4.2" fill="#03050c" />
  <!-- Lens Specular Highlight -->
  <circle cx="47" cy="46" r="2.2" fill="#ffffff" />
</svg>
